[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --timeout=30
    --alluredir=allure-results

markers =
    smoke: Quick sanity checks (run on every commit)
    regression: Full regression suite
    ai_generated: Tests created by AI enhancer
    scientific: Scientific calculator mode tests
    edge_case: Boundary and edge case tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
